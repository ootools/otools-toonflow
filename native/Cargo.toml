# Toonflow 的 OTools 插件 native 适配层。
#
# 本 crate 只做三件事：拉起打包在插件里的 Bun 边车、管住它的生命周期、
# 把端口报给宿主（`plugin_http_port`），业务逻辑一律留在上游 Toonflow。
#
# 独立 workspace：本仓不参与主仓 workspace，靠 `[workspace]` 自成一个根，
# 否则 `cargo build` 会向上找到主仓的 workspace 而失败。
[package]
name = "otools-toonflow-native"
version = "0.1.0"
edition = "2021"
description = "Toonflow as an OTools plugin: lifecycle for the bundled Bun sidecar"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_toonflow_native"

[dependencies]
serde_json = "1"

# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀（见主仓 ot-plugin-ffi 的说明）。
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
